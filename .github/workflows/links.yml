name: Check links

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # every Monday
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every link in the site
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --accept 200,201,204,206,301,302,303,307,308,403,429 --exclude-path .github index.html resources.html js/resources.js
          fail: true
